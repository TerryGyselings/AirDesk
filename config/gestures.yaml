# Réglages des gestes AirDesk.
# Toutes les distances sont normalisées par la taille de la main
# (distance poignet -> base du majeur), donc indépendantes de la distance à la caméra.

engagement:
  # Temps pendant lequel la main ouverte doit rester visible avant d'activer le contrôle.
  hold_ms: 300
  # Si la main disparaît plus longtemps que ça, retour en veille.
  lost_timeout_ms: 1000

pinch:
  # Hystérésis : on entre en pincement sous "enter", on en sort au-dessus de "exit".
  # "exit" > "enter" évite les relâchements involontaires pendant un glisser.
  enter: 0.25
  exit: 0.40
  # Un pincement plus court que ça = clic. Plus long = saisie (glisser).
  click_max_ms: 400
  # Règle anti-poing (poing fermé = pouce sur l'index replié = faux pincement).
  # A = d'origine (mesure seule) ; B = A + index tendu ;
  # C = B + au moins un autre doigt non replié ; D = A + au moins un autre doigt non replié
  # (sans condition sur l'index) ; B3D / C3D / D3D = idem avec la profondeur.
  # Choix du 2026-11-24 (2 sessions de P01, voir docs/journal.md) : D, ratio, délai 66 ms,
  # sans sortie sur repli. Mettre « rule: A » et « release_grace_ms: 0 » pour revenir au
  # comportement d'origine et comparer.
  rule: D
  # Extension minimale de l'index (règles B, C). Appris sur l'entraînement, non utilisé par D.
  min_index_extension: 0.80
  min_index_extension_3d: 0.86
  # Le pincement n'est relâché que si la condition de sortie tient pendant ce temps (ms).
  # 0 = relâchement immédiat. 66 ms = 2 images à 30 i/s.
  release_grace_ms: 66
  # Mesure comparée à enter / exit : ratio (pouce -> bout de l'index), seg78 / seg68
  # (pouce -> segment 7-8 ou 6-8 de l'index). enter / exit doivent être réglés pour elle.
  measure: ratio
  # Sortir aussi du pincement quand les autres doigts se replient (règles C, D...).
  exit_on_fold: false

quality:
  # Garde-fou : une image est ignorée (comme « main absente ») si hand_size tombe sous
  # min_hand_size_ratio × la médiane des hand_size_window_ms dernières millisecondes
  # (main de profil ou coupée). 0 = désactivé. PAS ENCORE utilisé.
  min_hand_size_ratio: 0.0
  hand_size_window_ms: 2000

fingers:
  # Extension sous laquelle un doigt est compté comme replié (bout -> centre de paume /
  # taille de main). Appris sur l'entraînement (scripts/analyse_gestures.py) : séparation
  # poing / pincement de « ext_autres_max », marge +0,26 (3D : +0,22).
  folded_below: 0.87
  folded_below_3d: 0.91

pointer:
  # Gain contrôle/affichage (pointage relatif, comme un pavé tactile) :
  # nombre de pixels parcourus par le curseur quand la main traverse toute la largeur de l'image.
  pixels_per_frame_width: 2400
  # Point de la main qui pilote le curseur (index MediaPipe). 9 = base du majeur, stable pendant le pincement.
  landmark: 9

filter:
  # Filtre 1€ (Casiez et al., CHI 2012). min_cutoff bas = curseur stable à basse vitesse,
  # beta haut = moins de retard quand la main bouge vite.
  # Les positions sont normalisées (0 à 1), d'où un beta plus grand que dans
  # l'article, qui travaille en pixels (environ 0,007 x 1280 px de large ≈ 9).
  min_cutoff: 1.0
  beta: 8.0
  d_cutoff: 1.0
