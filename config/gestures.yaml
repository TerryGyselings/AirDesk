# Réglages des gestes AirDesk.
# Toutes les distances sont normalisées par la taille de la main
# (distance poignet -> base du majeur), donc indépendantes de la distance à la caméra.

engagement:
  # Temps pendant lequel la main ouverte doit rester visible avant d'activer le contrôle.
  hold_ms: 300
  # Si la main disparaît plus longtemps que ça, retour en veille.
  lost_timeout_ms: 1000
  # Main baissée = veille : si le point de pointage reste sous le bord bas de la zone
  # d'interaction pendant ce temps, retour en veille (un glisser est relâché). 0 = désactivé.
  rest_ms: 500
  # La main ouverte n'active que dans la zone d'interaction (une main ouverte posée en bas
  # ne réactive pas ; sans ça, « main baissée = veille » oscillerait entre veille et actif).
  activate_in_zone: true

pinch:
  # Hystérésis : on entre en pincement sous "enter", on en sort au-dessus de "exit".
  # "exit" > "enter" évite les relâchements involontaires pendant un glisser.
  enter: 0.25
  exit: 0.40
  # Mode de clic :
  # - press (comme une souris) : Press dès le contact confirmé, Release au relâchement ; le
  #   curseur reste figé pendant l'appui tant que la main ne s'éloigne pas de drag_threshold.
  #   C'est le système qui distingue clic, double-clic et glisser. Latence du clic : environ
  #   min_press_frames images après le contact, au lieu de ~400 ms ;
  # - release (d'origine, pour comparer) : clic émis au relâchement, glisser après
  #   click_max_ms. Retour d'usage du 2026-11-24 : délai ressenti à chaque clic.
  click_mode: press
  # Mode press : images de pincement d'affilée avant le Press (anti-glitch du suivi).
  min_press_frames: 2
  # Mode press : distance (tailles de main) entre le point de contact et la main au-delà de
  # laquelle l'appui devient un glisser. Le curseur suit la main en permanence, sauf bouton
  # enfoncé sur place (il reste au point du clic, pour qu'aucun mini-glisser ne parte).
  # Déplacement du poignet pendant 24 vrais clics de P01 (3 logs) : 20 sous 0,12, traîne
  # 0,23 / 0,34 / 0,36 / 0,50. À ajuster avec
  # scripts/analyse_log.py (déplacement pendant les clics, saut au début des glisser).
  drag_threshold: 0.15
  # Mode press : à la fin du gel (début d'un glisser, fin d'un clic), le curseur rejoint la
  # main en ce temps (ms) au lieu de sauter du point figé à la main (pointage absolu).
  # 0 = saut direct.
  drag_catchup_ms: 100
  # Mode press, pointage absolu : double-clic aimanté. Un 2e Press à moins de
  # double_click_ms du Press précédent ET à moins de double_click_snap tailles de main de son
  # point de contact est émis au pixel exact du 1er clic (Windows exige ±2 px). auto = délai
  # de double-clic du système (Windows : GetDoubleClickTime, 500 ms par défaut).
  # double_click_snap : entre deux tapes, la main se déplace de 1 à 21 px (3 logs en mode
  # press, 2026-11-24 et 25), soit 0,03 à 0,037 taille de main (570 à 700 px par taille de
  # main). 0,08 (45 à 56 px) laisse une marge d'environ x2. 0 = pas d'aimant.
  double_click_ms: auto
  double_click_snap: 0.08
  # Mode release : un pincement plus court que ça = clic. Plus long = saisie (glisser).
  click_max_ms: 400
  # Règle anti-poing (poing fermé = pouce sur l'index replié = faux pincement).
  # A = d'origine (mesure seule) ; B = A + index tendu ;
  # C = B + au moins un autre doigt non replié ; D = A + au moins un autre doigt non replié
  # (sans condition sur l'index) ; B3D / C3D / D3D = idem avec la profondeur.
  # Choix du 2026-11-24 (2 sessions de P01, voir docs/journal.md) : D, ratio, délai 66 ms,
  # sans sortie sur repli. Mettre « rule: A » et « release_grace_ms: 0 » pour revenir au
  # comportement d'origine et comparer.
  # F = D + doigts qui se FERMENT au contact (closing_speed >= min_closing_speed) ; F3D = idem
  # en 3D. ESSAI du 2026-11-25 (analyse v4, sessions 17-13-15 / 17-16-37) : main au repos de
  # profil au centre (pouce posé, pinch_ratio médian 0,16) = 1 faux glisser par session avec
  # D. Vitesse de fermeture au contact : vrais pincements 3,36 (centre) / 1,01 (gauche)
  # contre 0,09 (repos de profil), J = 1,00, marge +0,54. ATTENTION : n = 11 / 4 seulement.
  # REPLI : « rule: D » (choix validé du 2026-11-24).
  rule: F
  # Extension minimale de l'index (règles B, C). Appris sur l'entraînement, non utilisé par D.
  min_index_extension: 0.80
  min_index_extension_3d: 0.86
  # Le pincement n'est relâché que si la condition de sortie tient pendant ce temps (ms).
  # 0 = relâchement immédiat. 66 ms = 2 images à 30 i/s.
  release_grace_ms: 66
  # Un relâchement en cours n'est annulé que si la mesure redescend sous exit - marge.
  # Sans marge, un relâchement lent qui oscille autour d'exit (0,398 / 0,404 / 0,397...)
  # était annulé à chaque passage juste sous 0,40, et un clic de 344 ms devenait un glisser
  # (log 18-19-43, 79 296 ms).
  release_cancel_margin: 0.05
  # Relâchement IMMÉDIAT (sans délai) au-dessus de exit + cette marge : doigts franchement
  # ouverts. Le délai et la marge d'annulation ne servent qu'aux valeurs proches d'exit.
  # Log 19-12-46 (65-67 s, double-clics) : entre deux tapes, les doigts ne restent ouverts
  # que 1 ou 2 images ; avec le délai seul, 4 appuis pour 14 tapes. Marge 0,05 : 11 appuis ;
  # 0,15 : 7. Pics pendant un glisser qui continue (24 glisser, 4 logs) : 3 au-dessus de
  # 0,40, aucun au-dessus de 0,45. 0 = désactivé.
  release_fast_margin: 0.05
  # Condition d'entrée : vitesse du poignet au contact < max_contact_speed (tailles de main
  # par seconde), raison de refus « mouvement ». 0 = désactivé. Proposition 1,8 (logs du
  # 2026-11-24) : 80 pincements suivis d'un clic ou d'un glisser, médiane 0,34, P95 1,65 ;
  # 3 refusés (3,13 / 3,63 / 4,82, peut-être involontaires) ; les 2 pincements en trop
  # (3,06 et 1,87, log 19-12-46 à 72 s) refusés. Marge mince : NON activée, à revoir.
  max_contact_speed: 0.0
  # Relâchement RELATIF (mode press, appui sur place seulement) : relâchement quand la mesure
  # remonte de plus de release_rise au-dessus de son minimum depuis le contact (et au-dessus
  # de enter), sans attendre exit. Sépare deux tapes rapides fusionnées (log 16-35-12 :
  # 0,11 -> 0,392 -> 0,128 à 13 250 ms ; 0,162 -> 0,338 -> 0,105 à 58 375 ms). Simulation
  # sur 62 glisser (9 logs) avec 0,15 : 7 ruptures, toutes dans des logs du mode release,
  # 0 dans les 3 logs du mode press ; 0,18 ne sépare plus l'épisode de 58 375.
  # VALIDÉ EN RÉEL le 25/11 (log 17-10-10) : 4 doubles-clics aimantés, aucun glisser coupé,
  # clics rapides séparés, latence 34 ms. scripts/analyse_log.py affiche le rejeu de chaque
  # log. 0 = désactivé.
  release_rise: 0.15
  # Règles F / F3D : vitesse de fermeture minimale au contact (baisse de pinch_ratio par
  # seconde, sur 200 ms). Essai : 0,4 (seuil proposé par l'analyse v4 : 0,39 ; n faible).
  min_closing_speed: 0.4
  min_closing_speed_3d: 0.0
  # Règles F / F3D : pas de condition de fermeture pour un contact moins de ce temps (ms)
  # après la fin du pincement précédent. 2e tape d'un double-clic : la vitesse sur 200 ms
  # remonte jusqu'au creux de la 1re tape, elle est faible ou négative. Sans exemption, F à
  # 0,4 aurait refusé 14 contacts réels (logs 19-12-46, 19-28-35, 17-10-10), tous 31 à 125 ms
  # après un relâchement, dont les 4 doubles-clics du 17-10-10. 300 ms les couvre et reste
  # sous le délai de double-clic (500 ms). 0 = pas d'exemption.
  closing_grace_ms: 300
  # Mesure comparée à enter / exit : ratio (pouce -> bout de l'index), seg78 / seg68
  # (pouce -> segment 7-8 ou 6-8 de l'index). enter / exit doivent être réglés pour elle.
  measure: ratio
  # Sortir aussi du pincement quand les autres doigts se replient (règles C, D...).
  exit_on_fold: false
  # Entrée en pincement seulement si la paume fait face à la caméra.
  # DÉSACTIVÉ le 2026-11-24 : en pointage absolu, la main qui vise la GAUCHE de l'écran
  # pivote et passe de profil ; la condition refusait alors les vrais clics. Preuve : log
  # 18-19-43, 82 515 ms, vrai clic à gauche (curseur x ≈ 290 px) refusé avec palm_width
  # 0,06-0,15 < 0,22. Pistes à l'étude (session v4) : pinch_ratio_3d, vitesse de fermeture.
  require_palm_facing: false
  # Largeur apparente minimale de la paume (base index 5 -> base auriculaire 17, divisée par
  # la taille de main). PROVISOIRE, en attendant les mesures (séquence main_repos_profil) :
  # - main synthétique : de face 0,80, tournée de 60° 0,40, de profil (80°) 0,14 ;
  # - vrais pincements « OK » de P01 (2 sessions) : bien plus étroits, médiane 0,46, P5 0,26.
  #   0,40 en rejetait 22 % / 35 % (répétés 9/10 -> 5/10 au test) ; 0,22 en rejette
  #   0 % / 7,5 % et écarte encore une main franchement de profil.
  min_palm_width: 0.22
  # Un pincement ne peut commencer que si le point de pointage est dans la zone
  # d'interaction (main levée) ; un pincement commencé dans la zone continue au-delà.
  only_in_zone: true

hand:
  # Main PILOTE : seule une main de ce côté active et pilote (right, left ; any = n'importe
  # laquelle, ancien comportement). L'autre main est une main d'appoint, sans effet seule
  # (Guiard, 1987 ; voir interpretation/hand_selection.py).
  preferred: right
  # Une fois actif, on suit la main pilote par continuité ; un saut du poignet plus grand que
  # ça (en tailles de main, d'une image à l'autre) = main pilote perdue.
  max_jump: 1.5
  # Suivre aussi la main d'appoint une fois actif (futurs gestes à deux mains) : ~10 ms de
  # plus par image (MediaPipe doit chercher 2 mains). Inutile pour l'instant.
  track_support: false
  # Mode 2 mains (coûteux) seulement quand il sert : en veille, une main non pilote visible
  # fait chercher 2 mains pendant two_hands_hold_ms ; une fois actif, seulement après
  # search_after_lost_frames images sans main pilote. Log 18-43-22 : 435 des 479 images en
  # mode 2 mains étaient en veille avec un champ vide.
  two_hands_hold_ms: 1000
  search_after_lost_frames: 3

quality:
  # Garde-fou : une image est ignorée (comme « main absente ») si hand_size tombe sous
  # min_hand_size_ratio × la médiane des hand_size_window_ms dernières millisecondes
  # (main de profil ou coupée). 0 = désactivé. PAS ENCORE utilisé.
  min_hand_size_ratio: 0.0
  hand_size_window_ms: 2000

fingers:
  # Extension sous laquelle un doigt est compté comme replié (bout -> centre de paume /
  # taille de main). Règle D / F : il faut au moins un autre doigt (majeur, annulaire,
  # auriculaire) au-dessus de ce seuil, sinon c'est un poing.
  # 2026-11-25 : 0,87 -> 0,65. En règle F, la vitesse de fermeture écarte déjà la main au
  # repos de profil : ce seuil ne sert plus qu'au poing. Main tournée vers la gauche = autres
  # doigts raccourcis à l'image : 7 vrais clics refusés dans le log 17-41-02
  # (ext_autres_max 0,75-0,87). Sessions v4 : poing P95 0,40 / 0,49, max 0,56 ; 0 faux
  # épisode de poing jusqu'à 0,55 ; pincements répétés à gauche 6/10 -> 8/10.
  # En revenant à « rule: D », remettre 0,87 (D compte sur ce seuil contre la main de profil).
  folded_below: 0.65
  # Seuil 3D : utilisé seulement par les règles B3D / C3D / D3D / F3D (pas en service).
  folded_below_3d: 0.91

pointer:
  # absolute : la zone d'interaction de l'image est projetée sur l'écran entier (la main et
  #            le curseur ne se désynchronisent pas) ;
  # relative : comme un pavé tactile (gain pixels_per_frame_width).
  mode: absolute
  # Zone d'interaction, en fractions de l'image (0 = bord gauche / haut, 1 = droit / bas).
  # Hors zone, le curseur reste collé au bord de l'écran. Dessinée dans la fenêtre de debug.
  # Défaut abaissé de 0,05 le 2026-11-24 (usage réel de P01 : point de
  # pointage collé en bas 3 % du temps contre 0,15 % en haut, hauteur médiane 0,50).
  zone:
    left: 0.15
    right: 0.85
    top: 0.20
    bottom: 0.80
  # Écran couvert en mode absolu : primary (écran principal) ou all (rectangle englobant de
  # tous les écrans ; voir les limites dans le README).
  screen: primary
  # Gain du mode relatif : nombre de pixels parcourus par le curseur quand la main traverse
  # toute la largeur de l'image.
  pixels_per_frame_width: 2400
  # Point de la main qui pilote le curseur (index MediaPipe). 9 = base du majeur, stable pendant le pincement.
  landmark: 9

filter:
  # Filtre 1€ (Casiez et al., CHI 2012). min_cutoff bas = curseur stable à basse vitesse,
  # beta haut = moins de retard quand la main bouge vite.
  # Les positions sont normalisées (0 à 1), d'où un beta plus grand que dans
  # l'article, qui travaille en pixels (environ 0,007 x 1280 px de large ≈ 9).
  # Réglage séparé par mode, car le bruit de la main n'est pas amplifié pareil.
  absolute:
    # Valeurs de départ PROVISOIRES (objectif : tremblement < 2 px main immobile, mesuré par
    # scripts/analyse_log.py). En absolu, 1 pixel caméra ≈ 5,7 px écran (2560 / (640 × 0,70))
    # contre 3,75 px en relatif (2400 / 640) : bruit amplifié ≈ 1,5 fois. Pour un passe-bas
    # du 1er ordre et un bruit blanc, l'écart-type restant varie comme √(coupure) : diviser
    # le tremblement par 1,5 demande une coupure divisée par 1,5² ≈ 2,25, soit 1,0 -> 0,45,
    # arrondi à 0,5. beta inchangé pour garder la réactivité sur les gestes rapides.
    min_cutoff: 0.5
    beta: 8.0
    d_cutoff: 1.0
  relative:
    min_cutoff: 1.0
    beta: 8.0
    d_cutoff: 1.0
