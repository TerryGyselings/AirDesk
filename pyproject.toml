[project]
name = "airdesk"
version = "0.1.0"
description = "IHM gestuelle sans clavier ni souris : piloter le bureau avec la main devant une webcam."
readme = "README.md"
# MediaPipe ne publie pas toujours ses paquets pour la toute dernière version de Python.
requires-python = ">=3.10,<3.13"
dependencies = [
    "mediapipe>=0.10.14",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pynput>=1.7.7",
    "pywinctl>=0.4",
    # Taille et position des écrans (pointage absolu) ; remplace pywinctl.getScreenSize().
    "pymonctl>=0.92",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
airdesk = "airdesk.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airdesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
